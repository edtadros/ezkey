name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Show Swift
        run: swift --version
      - name: Test
        run: swift test --package-path .
      - name: Build the app the way install.sh does (not uploaded)
        env:
          SKIP_TESTS: "1"
          SKIP_VERIFY: "1"
          SKIP_INSTALL: "1"
        run: |
          ./scripts/build-and-run.sh
          codesign --verify --deep --strict build/ezkey.app

  site-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Site worker tests
        run: node --experimental-strip-types --test tests/site/worker.test.ts tests/site/public-repo.test.ts tests/site/review-checklist.test.ts

  ci-gate:
    if: always()
    needs: [test, site-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require test success
        run: test "${{ needs.test.result }}" = "success" && test "${{ needs.site-test.result }}" = "success"
