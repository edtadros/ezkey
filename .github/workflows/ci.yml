name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test
        run: swift test --package-path .
      - name: Refuse to upload an app
        run: |
          echo "CI does not attach ezkey.app. Unsigned CI binaries are not a distribution channel."

  ci-gate:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require test success
        run: test "${{ needs.test.result }}" = "success"
