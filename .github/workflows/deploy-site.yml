name: deploy-site

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "site/**"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check Cloudflare secrets
        id: check-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "notice=Cloudflare secrets not configured; skipping Worker deploy. Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable." >> "$GITHUB_OUTPUT"
            echo "secrets-present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not configured; skipping Worker deploy. Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable."
          else
            echo "secrets-present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Worker
        if: steps.check-secrets.outputs.secrets-present == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
